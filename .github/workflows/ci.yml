name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 -cover ./...
      - run: go build -o bin/recovery ./cmd/recovery
      - run: ./bin/recovery demo
      - run: python3 scripts/smoke.py
      - run: python3 scripts/benchmark.py --invoices 8 --workers 1,2 --runs 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-contracts.txt
      - run: python -m pip install -r scripts/requirements-contracts.txt
      - run: python scripts/check_api.py
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/compose_smoke.py
