x-runtime: &runtime
  build: .
  image: payment-decline-recovery:local
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 10s
  environment: &local-network
    NO_PROXY: "127.0.0.1,localhost,api,provider"
    no_proxy: "127.0.0.1,localhost,api,provider"

services:
  api:
    <<: *runtime
    command: [serve, -db, /data/engine.db, -listen, "0.0.0.0:8080"]
    environment:
      <<: *local-network
      RECOVERY_WEBHOOK_SECRET: "${RECOVERY_WEBHOOK_SECRET:?Copy .env.example to .env for the disposable demo}"
    ports:
      - "127.0.0.1:${RECOVERY_API_PORT:-8080}:8080"
    volumes:
      - engine-data:/data
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  provider:
    <<: *runtime
    command: [provider, -db, /data/provider.db, -listen, "0.0.0.0:8090", -fault, "${RECOVERY_PROVIDER_FAULT:-drop_after_commit}"]
    ports:
      - "127.0.0.1:${RECOVERY_PROVIDER_PORT:-8090}:8090"
    volumes:
      - provider-data:/data
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, "http://127.0.0.1:8090/snapshot"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  worker:
    <<: *runtime
    command: [worker, -db, /data/engine.db, -gateway, "http://provider:8090"]
    volumes:
      - engine-data:/data
    depends_on:
      api:
        condition: service_healthy
      provider:
        condition: service_healthy

volumes:
  engine-data:
  provider-data:
